# Local stack: MongoDB + API.  `docker compose up --build`
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/grysosta
    ports: ["4000:4000"]
    volumes: ["uploads:/app/uploads"]
    depends_on: [mongo]
volumes:
  mongo-data:
  uploads:
